<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 15px; fill: #FFFFFF; letter-spacing: 0.05em; }
      .subtitle { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #E32619; text-anchor: end; }
      .label-head { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; text-transform: uppercase; }
      .label-sub { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; }
      .label-desc { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #333333; }
      .badge-text { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 9px; fill: #FFFFFF; text-anchor: middle; }
      .param-val { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; fill: #0A0A0A; }
    </style>
    <pattern id="grid-syn" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="0" y="52" width="800" height="448" fill="url(#grid-syn)" />

  <rect x="0" y="0" width="800" height="52" fill="#0A0A0A"/>
  <text x="24" y="32" class="title">SCH-20 : SYNTHÈSE INDUSTRIELLE &amp; BILAN PLANOGRAPHIQUE</text>
  <text x="776" y="32" class="subtitle">DE LA PIERRE CALCAIRE AUX FORMES MODERNES CTP</text>

  <!-- Left: The Evolutionary Chain -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="370" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="220" height="20" fill="#0A0A0A"/>
    <text x="125" y="24" class="badge-text">CHAÎNE DE MATURITÉ TECHNIQUE</text>

    <!-- Node 1 -->
    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="320" height="40" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="24" class="param-val">1796 : Aloys Senefelder &bull; Calcaire</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(25, 95)">
      <rect x="0" y="0" width="320" height="40" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="24" class="param-val">1860-1900 : Feuilles Zinc &amp; Aluminium</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(25, 145)">
      <rect x="0" y="0" width="320" height="40" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="24" class="param-val">1950 : Grainage Électrolytique &amp; Anodisation</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="320" height="40" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="24" class="param-val">1970 : Couches Diazo &amp; Photopolymères</text>
    </g>

    <!-- Node 5 -->
    <g transform="translate(25, 245)">
      <rect x="0" y="0" width="320" height="50" fill="#E32619"/>
      <text x="160" y="26" class="title" font-size="12px" fill="#FFFFFF" text-anchor="middle">AUJOURD'HUI : STANDARD OFFSET CTP</text>
      <text x="160" y="42" class="badge-text" fill="#FFFFFF">Génération laser directe sans film photographique</text>
    </g>
  </g>

  <!-- Right: Pillars of Modern Lithography -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="220" height="20" fill="#0A0A0A"/>
    <text x="125" y="24" class="badge-text">PILIERS SCIENTIFIQUES FONDAMENTAUX</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="310" height="65" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="20" class="label-head" fill="#E32619">1. Planographie Pure</text>
      <text x="15" y="38" class="label-desc">Aucune différence d'élévation mécanique.</text>
      <text x="15" y="52" class="label-desc">Antagonisme physico-chimique eau / encre grasse.</text>
    </g>

    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="310" height="65" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="20" class="label-head" fill="#E32619">2. Micro-Rugosité Contrôlée</text>
      <text x="15" y="38" class="label-desc">Alumine poreuse Al2O3 dureté 9 Mohs.</text>
      <text x="15" y="52" class="label-desc">Film d'eau micrométrique de 4.5 à 10 microns.</text>
    </g>

    <g transform="translate(20, 205)">
      <rect x="0" y="0" width="310" height="65" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="20" class="label-head" fill="#E32619">3. Photochimie de Haute Précision</text>
      <text x="15" y="38" class="label-desc">Insolation sélective sous trame jusqu'à 300 lpi.</text>
      <text x="15" y="52" class="label-desc">Endurance de plusieurs millions de tours de cylindre.</text>
    </g>

    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="310" height="25" fill="#0A0A0A"/>
      <text x="155" y="16" class="badge-text" fill="#FFFFFF">BILAN : MAÎTRISE TOTALE DU MOUILLAGE</text>
    </g>
  </g>

  <!-- Bottom Closing -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="740" height="65" fill="#0A0A0A"/>
    <text x="25" y="26" class="title" fill="#FFFFFF" font-size="12px">CONCLUSION &amp; SYNTHÈSE INDUSTRIELLE DU MODULE</text>
    <text x="25" y="48" class="label-desc" fill="#D1D5DB">La plaque offset demeure le pivot de la productivité d'imprimerie mondiale, alliant finesse microscopique et endurance industrielle.</text>
  </g>
</svg>