<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 15px; fill: #FFFFFF; letter-spacing: 0.05em; }
      .subtitle { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #E32619; text-anchor: end; }
      .label-head { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; text-transform: uppercase; }
      .label-sub { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; }
      .label-desc { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #333333; }
      .badge-text { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 9px; fill: #FFFFFF; text-anchor: middle; }
      .param-val { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; fill: #0A0A0A; }
    </style>
    <pattern id="grid-photo" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="0" y="52" width="800" height="448" fill="url(#grid-photo)" />

  <rect x="0" y="0" width="800" height="52" fill="#0A0A0A"/>
  <text x="24" y="32" class="title">SCH-15 : PHOTOPOLYMÈRES &amp; PROCÉDÉ NÉGATIF</text>
  <text x="776" y="32" class="subtitle">RÉTICULATION RADICALAIRE TRIDIMENSIONNELLE &#8226; TIRAGES ROTATIVES &gt; 1M</text>

  <!-- Left: Radical Polymerization Mechanism -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="370" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="220" height="20" fill="#0A0A0A"/>
    <text x="125" y="24" class="badge-text">MÉCANISME DE RÉTICULATION</text>

    <!-- Monomers initial -->
    <rect x="25" y="50" width="320" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
    <text x="40" y="75" class="label-head">1. Monomères &amp; Photoamorceurs Libres</text>
    <circle cx="60" cy="110" r="10" fill="#CBD5E1" stroke="#0A0A0A" stroke-width="1"/>
    <circle cx="100" cy="110" r="10" fill="#CBD5E1" stroke="#0A0A0A" stroke-width="1"/>
    <circle cx="140" cy="110" r="10" fill="#CBD5E1" stroke="#0A0A0A" stroke-width="1"/>
    <text x="175" y="115" class="label-desc">Monomères solubles avant irradiation UV</text>

    <!-- UV Crosslinking Network -->
    <rect x="25" y="180" width="320" height="120" fill="#FEE2E2" stroke="#E32619" stroke-width="1.5"/>
    <text x="40" y="205" class="label-head" fill="#E32619">2. Réseau Tridimensionnel Réticulé</text>
    <path d="M 50 240 L 90 260 L 130 230 L 170 270 L 210 240" fill="none" stroke="#E32619" stroke-width="3"/>
    <circle cx="50" cy="240" r="6" fill="#0A0A0A"/>
    <circle cx="90" cy="260" r="6" fill="#0A0A0A"/>
    <circle cx="130" cy="230" r="6" fill="#0A0A0A"/>
    <circle cx="170" cy="270" r="6" fill="#0A0A0A"/>
    <circle cx="210" cy="240" r="6" fill="#0A0A0A"/>
    <text x="40" y="285" class="label-desc" font-weight="700">Polymère durci, insoluble dans tout solvant doux.</text>
  </g>

  <!-- Right: Negative Workflow Application -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="220" height="20" fill="#0A0A0A"/>
    <text x="125" y="24" class="badge-text">PROCÉDÉ NÉGATIF INDUSTRIEL</text>

    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="300" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="22" class="param-val">Film Négatif Transparent / Noir</text>
      <text x="15" y="40" class="label-desc">La lumière traverse uniquement le graphisme à imprimer.</text>
    </g>

    <g transform="translate(25, 110)">
      <rect x="0" y="0" width="300" height="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
      <text x="15" y="22" class="param-val" fill="#B45309">Insolation UV Puissante</text>
      <text x="15" y="40" class="label-desc">Réticulation immédiate du graphisme : polymère durci.</text>
    </g>

    <g transform="translate(25, 175)">
      <rect x="0" y="0" width="300" height="50" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
      <text x="15" y="22" class="param-val" fill="#0369A1">Révélation par Dissolution</text>
      <text x="15" y="40" class="label-desc">Élimination des zones non-insolées (fonds blancs).</text>
    </g>

    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="300" height="45" fill="#0A0A0A"/>
      <text x="150" y="28" class="badge-text" fill="#FFFFFF">ENDURANCE ROTATIVES : &gt; 1 000 000 EXEMPLAIRES</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="740" height="65" fill="#0A0A0A"/>
    <text x="25" y="26" class="title" fill="#FFFFFF" font-size="12px">DESTINATION : ROTATIVES HAUTE VITESSE &amp; PRESSE QUOTIDIENNE</text>
    <text x="25" y="48" class="label-desc" fill="#D1D5DB">Résistance mécanique extrême à l'usure, aux solvants d'encres et aux cadences de rotatives dépassant 60 000 ex/heure.</text>
  </g>
</svg>