<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 15px; fill: #FFFFFF; letter-spacing: 0.05em; }
      .subtitle { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #E32619; text-anchor: end; }
      .label-head { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; text-transform: uppercase; }
      .label-sub { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; }
      .label-desc { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #333333; }
      .badge-text { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 9px; fill: #FFFFFF; text-anchor: middle; }
      .param-val { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; fill: #0A0A0A; }
    </style>
    <pattern id="grid-ec" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-red-ec" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E32619" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="0" y="52" width="800" height="448" fill="url(#grid-ec)" />

  <rect x="0" y="0" width="800" height="52" fill="#0A0A0A"/>
  <text x="24" y="32" class="title">SCH-11 : GRAINAGE ÉLECTROCHIMIQUE EN BAIN ACIDE</text>
  <text x="776" y="32" class="subtitle">COURANT ALTERNATIF (AC) &#8226; FILM D'EAU 4.5-10 µm &#8226; &gt; 1M TIRAGES</text>

  <!-- Left: Tank & Electrodes -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="370" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="220" height="20" fill="#0A0A0A"/>
    <text x="125" y="24" class="badge-text">CUVE D'ÉLECTROGRAINAGE AC</text>

    <!-- Electrolyte bath -->
    <rect x="25" y="60" width="320" height="180" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="185" y="80" class="label-sub" fill="#0369A1" text-anchor="middle">Bain d'Électrolyte Acide (HCl / HNO3)</text>

    <!-- Electrodes & Plate -->
    <rect x="45" y="100" width="20" height="120" fill="#64748B" stroke="#0A0A0A" stroke-width="1.5"/>
    <text x="55" y="235" class="label-desc" text-anchor="middle">Électrode</text>

    <rect x="305" y="100" width="20" height="120" fill="#64748B" stroke="#0A0A0A" stroke-width="1.5"/>
    <text x="315" y="235" class="label-desc" text-anchor="middle">Électrode</text>

    <!-- Aluminium Plate in center -->
    <rect x="175" y="90" width="20" height="140" fill="#CBD5E1" stroke="#E32619" stroke-width="2.5"/>
    <text x="185" y="245" class="label-sub" fill="#E32619" text-anchor="middle">Bande Aluminium</text>

    <!-- AC generator -->
    <circle cx="185" cy="40" r="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M 175 40 Q 180 34 185 40 T 195 40" fill="none" stroke="#0A0A0A" stroke-width="2"/>
    <text x="210" y="44" class="param-val">Courant Alternatif (AC)</text>

    <path d="M 170 38 L 55 38 L 55 98" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
    <path d="M 200 38 L 315 38 L 315 98" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>

    <rect x="25" y="260" width="320" height="45" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
    <text x="35" y="278" class="label-desc" font-weight="700">Attaque électrochimique homogène et isotrope :</text>
    <text x="35" y="295" class="label-desc">Micro-pores sphéroïdaux calibrés sans micro-fissures.</text>
  </g>

  <!-- Right: Microstructure Profile -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="200" height="20" fill="#0A0A0A"/>
    <text x="115" y="24" class="badge-text">PROFIL MICRO-GÉOMÉTRIQUE</text>

    <!-- Topography Wave -->
    <path d="M 25 150 Q 40 130 55 150 T 85 150 T 115 150 T 145 150 T 175 150 T 205 150 T 235 150 T 265 150 T 295 150 T 325 150 L 325 210 L 25 210 Z" fill="#94A3B8" stroke="#0A0A0A" stroke-width="2"/>
    <text x="175" y="190" class="label-sub" fill="#FFFFFF" text-anchor="middle">Aluminium Électrograiné</text>

    <!-- Water Film Layer -->
    <rect x="25" y="125" width="300" height="25" fill="#38BDF8" fill-opacity="0.4" stroke="#0284C7" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="175" y="118" class="label-sub" fill="#0284C7" text-anchor="middle">Film d'eau de mouillage ultra-mince : 4.5 à 10 µm</text>

    <!-- Specs Grid -->
    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="300" height="75" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="15" y="20" class="param-val">&#8226; Trame d'impression :</text>
      <text x="165" y="20" class="param-val" fill="#E32619">Jusqu'à 300 lpi</text>
      <text x="15" y="42" class="param-val">&#8226; Rétention d'eau :</text>
      <text x="165" y="42" class="param-val">Film 4.5 - 10 µm</text>
      <text x="15" y="64" class="param-val">&#8226; Endurance presse :</text>
      <text x="165" y="64" class="param-val" fill="#E32619">&gt; 1 000 000 tirages</text>
    </g>
  </g>

  <!-- Bottom Metric Banner -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="740" height="65" fill="#0A0A0A"/>
    <text x="25" y="26" class="title" fill="#FFFFFF" font-size="12px">PERFORMANCE INDUSTRIELLE : GRAINAGE ÉLECTROCHIMIQUE</text>
    <text x="25" y="48" class="label-desc" fill="#D1D5DB">Régularité millimétrique de l'attaque acide sous inversion de polarité AC &bull; Aucun écrasement du point de trame en haute linéature.</text>
    <rect x="580" y="12" width="140" height="40" fill="#E32619"/>
    <text x="650" y="36" class="title" font-size="14px" text-anchor="middle">&gt; 1 MILLION</text>
  </g>
</svg>