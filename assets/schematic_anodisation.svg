<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 15px; fill: #FFFFFF; letter-spacing: 0.05em; }
      .subtitle { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #E32619; text-anchor: end; }
      .label-head { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; text-transform: uppercase; }
      .label-sub { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; }
      .label-desc { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #333333; }
      .badge-text { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 9px; fill: #FFFFFF; text-anchor: middle; }
      .param-val { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; fill: #0A0A0A; }
    </style>
    <pattern id="grid-anod" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="0" y="52" width="800" height="448" fill="url(#grid-anod)" />

  <rect x="0" y="0" width="800" height="52" fill="#0A0A0A"/>
  <text x="24" y="32" class="title">SCH-12 : ANODISATION ET COUCHE D'ALUMINE (Al2O3)</text>
  <text x="776" y="32" class="subtitle">DURETÉ PROCHE DU CORINDON &#8226; ANTI-GRAISSAGE &amp; ANTI-ABRASION</text>

  <!-- Left: Electrochemical Oxidation Cell -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="370" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="210" height="20" fill="#0A0A0A"/>
    <text x="120" y="24" class="badge-text">CELLULE D'ANODISATION (H2SO4)</text>

    <!-- Acid Bath -->
    <rect x="25" y="50" width="320" height="200" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="185" y="70" class="label-sub" fill="#B45309" text-anchor="middle">Bain d'Acide Sulfurique (H2SO4)</text>

    <!-- Plate as Anode (+) -->
    <rect x="80" y="90" width="30" height="140" fill="#94A3B8" stroke="#E32619" stroke-width="2"/>
    <rect x="110" y="90" width="8" height="140" fill="#E32619"/>
    <text x="95" y="245" class="label-sub" fill="#E32619" text-anchor="middle">Anode (+) Al</text>

    <!-- Cathode (-) -->
    <rect x="250" y="90" width="30" height="140" fill="#475569" stroke="#0A0A0A" stroke-width="2"/>
    <text x="265" y="245" class="label-sub" fill="#0A0A0A" text-anchor="middle">Cathode (-)</text>

    <!-- Circuit DC -->
    <path d="M 95 90 L 95 35 L 265 35 L 265 90" fill="none" stroke="#0A0A0A" stroke-width="2"/>
    <circle cx="180" cy="35" r="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <text x="180" y="39" class="param-val" text-anchor="middle">DC</text>

    <g transform="translate(25, 260)">
      <rect x="0" y="0" width="320" height="45" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-desc" font-weight="700">Réaction Anodique Principale :</text>
      <text x="10" y="35" class="param-val" fill="#E32619">2 Al + 3 H2O &#8594; Al2O3 (Alumine) + 6 H+ + 6 e-</text>
    </g>
  </g>

  <!-- Right: Micro-Porous Al2O3 Structure -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="220" height="20" fill="#0A0A0A"/>
    <text x="125" y="24" class="badge-text">COUCHE D'ALUMINE AL2O3</text>

    <!-- Base Aluminium -->
    <rect x="25" y="210" width="300" height="60" fill="#94A3B8" stroke="#0A0A0A" stroke-width="2"/>
    <text x="175" y="245" class="label-sub" fill="#FFFFFF" text-anchor="middle">Substrat Aluminium Pur</text>

    <!-- Porous Hexagonal Al2O3 layer -->
    <rect x="25" y="90" width="300" height="120" fill="#FEE2E2" stroke="#E32619" stroke-width="2"/>
    <!-- Micro-pores -->
    <line x1="60" y1="90" x2="60" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="100" y1="90" x2="100" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="140" y1="90" x2="140" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="180" y1="90" x2="180" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="220" y1="90" x2="220" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="260" y1="90" x2="260" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="300" y1="90" x2="300" y2="200" stroke="#E32619" stroke-width="3" stroke-dasharray="8,6"/>
    <text x="175" y="150" class="label-sub" fill="#991B1B" text-anchor="middle">Couche d'Oxyde Al2O3 (Dureté Corindon 9 Mohs)</text>

    <g transform="translate(25, 275)">
      <rect x="0" y="0" width="300" height="35" fill="#0A0A0A"/>
      <text x="15" y="22" class="badge-text" fill="#FFFFFF">BARRIÈRE ULTRA-RÉSISTANTE CONTRE LE GRAISSAGE ET L'ABRASION</text>
    </g>
  </g>

  <!-- Bottom Summary -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="740" height="65" fill="#0A0A0A"/>
    <text x="25" y="26" class="title" fill="#FFFFFF" font-size="12px">AVANTAGES CLÉS DE L'ANODISATION INDUSTRIELLE</text>
    <text x="25" y="48" class="label-desc" fill="#D1D5DB">Protection chimique contre l'oxydation de l'air &bull; Résistance au frottement du blanchet &bull; Élimination des voiles de graissage.</text>
  </g>
</svg>