<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 15px; fill: #FFFFFF; letter-spacing: 0.05em; }
      .subtitle { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #E32619; text-anchor: end; }
      .label-head { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; text-transform: uppercase; }
      .label-sub { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; }
      .label-desc { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #333333; }
      .badge-text { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 9px; fill: #FFFFFF; text-anchor: middle; }
      .param-val { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; fill: #0A0A0A; }
    </style>
    <pattern id="grid-ins" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="0" y="52" width="800" height="448" fill="url(#grid-ins)" />

  <rect x="0" y="0" width="800" height="52" fill="#0A0A0A"/>
  <text x="24" y="32" class="title">SCH-16 : CYCLE COMPARATIF PHOTOCHIMIQUE</text>
  <text x="776" y="32" class="subtitle">INSOLATION SOUS VIDE &#8226; RÉACTION DE DÉVELOPPEMENT CHIMIQUE</text>

  <!-- Left: Procedé Positif (Diazo) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="360" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="180" height="20" fill="#0A0A0A"/>
    <text x="105" y="24" class="badge-text">PROCÉDÉ POSITIF (DIAZO)</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="320" height="55" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-head">Étape 1 : Insolation sous vide</text>
      <text x="10" y="34" class="label-desc">Châssis pneumatique : contact intime film positif / plaque.</text>
      <text x="10" y="48" class="param-val" fill="#E32619">La lumière UV détruit le fond blanc.</text>
    </g>

    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="320" height="55" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-head">Étape 2 : Développement alcalin</text>
      <text x="10" y="34" class="label-desc">Révélateur aqueux alcalin (pH 12 - 13) dissout l'acide.</text>
      <text x="10" y="48" class="param-val">Seul le graphisme non-exposé subsiste.</text>
    </g>

    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="320" height="55" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-head">Étape 3 : Rinçage &amp; Gommage</text>
      <text x="10" y="34" class="label-desc">Neutralisation à l'eau pure et protection à la gomme.</text>
    </g>

    <g transform="translate(20, 255)">
      <rect x="0" y="0" width="320" height="45" fill="#E32619"/>
      <text x="160" y="28" class="badge-text">80% DES APPLICATIONS ÉDITION &amp; LABEUR</text>
    </g>
  </g>

  <!-- Right: Procedé Négatif (Photopolymère) -->
  <g transform="translate(410, 75)">
    <rect x="0" y="0" width="360" height="320" fill="#F8FAFC" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="15" y="10" width="200" height="20" fill="#0A0A0A"/>
    <text x="115" y="24" class="badge-text">PROCÉDÉ NÉGATIF (POLYMER)</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="320" height="55" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-head">Étape 1 : Insolation puissante</text>
      <text x="10" y="34" class="label-desc">Lumière traverse les fenêtres transparentes du film.</text>
      <text x="10" y="48" class="param-val" fill="#E32619">Polymérisation immédiate du graphisme.</text>
    </g>

    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="320" height="55" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-head">Étape 2 : Lavage &amp; Dissolution</text>
      <text x="10" y="34" class="label-desc">Les monomères non-insolés sont éliminés par brossage.</text>
      <text x="10" y="48" class="param-val">Mise à nu de l'aluminium anodisé hydrophile.</text>
    </g>

    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="320" height="55" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
      <text x="10" y="18" class="label-head">Étape 3 : Cuisson Optionnelle</text>
      <text x="10" y="34" class="label-desc">Passage au four à 240°C pour tripler la résistance.</text>
    </g>

    <g transform="translate(20, 255)">
      <rect x="0" y="0" width="320" height="45" fill="#0A0A0A"/>
      <text x="160" y="28" class="badge-text">ROTATIVES DE PRESSE &amp; GRANDS TIRAGES</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="740" height="65" fill="#0A0A0A"/>
    <text x="25" y="26" class="title" fill="#FFFFFF" font-size="12px">SYNTHÈSE DU COMPORTEMENT PHOTOCHIMIQUE</text>
    <text x="25" y="48" class="label-desc" fill="#D1D5DB">Positif : la lumière détruit (solubilise). Négatif : la lumière construit (réticule et durcit).</text>
  </g>
</svg>